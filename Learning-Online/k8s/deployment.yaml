apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-study-frontend
  labels:
    app: online-study-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: online-study-frontend
  template:
    metadata:
      labels:
        app: online-study-frontend
    spec:
      containers:
      - name: frontend
        image: ledung209/online-study-frontend:v1
        imagePullPolicy: Always
        ports:
        - containerPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-study-backend
  labels:
    app: online-study-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: online-study-backend
  template:
    metadata:
      labels:
        app: online-study-backend
    spec:
      containers:
      - name: backend
        image: ledung209/online-study-backend:v1
        imagePullPolicy: Always
        ports:
        - containerPort: 5000 
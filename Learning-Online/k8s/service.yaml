apiVersion: v1
kind: Service
metadata:
  name: online-study-frontend-service
spec:
  type: NodePort
  selector:
    app: online-study-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080 
apiVersion: v1
kind: Service
metadata:
  name: online-study-backend-service
spec:
  type: ClusterIP
  selector:
    app: online-study-backend
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000